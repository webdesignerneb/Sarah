<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLINE by Sarah — Women's Clothing & Accessories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#1f1419;
    --ink-soft:#2f1e26;
    --bone:#f6ece7;
    --bone-dim:#d8b9bc;
    --gold:#b28a4c;
    --gold-bright:#d3ac6c;
    --clay:#c1897a;
    --pink:#e79aa6;
    --pink-bright:#f2b6c0;
    --green:#333f34;
    --line: rgba(246,236,231,0.14);
    --line-strong: rgba(246,236,231,0.28);
    --radius: 14px;
  }
  .script{ font-family:'Petit Formal Script', cursive; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:'Inter', sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--gold); color:var(--ink); }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  img{max-width:100%; display:block;}
  .display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold-bright);
  }
  .wrap{ max-width:1240px; margin:0 auto; padding:0 40px; }
  @media(max-width:700px){ .wrap{ padding:0 20px; } }

  .chain-divider{ width:100%; height:34px; overflow:hidden; opacity:0.55; }
  .chain-divider svg{ width:100%; height:100%; display:block; }
  .chain-link{ animation: chainSlide 22s linear infinite; }
  @keyframes chainSlide{ from{ transform:translateX(0);} to{ transform:translateX(-240px);} }
  @media (prefers-reduced-motion: reduce){ .chain-link{ animation:none; } }

  header{
    position:sticky; top:0; z-index:60;
    background:rgba(21,20,15,0.88);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    height:76px;
  }
  .logo{ font-family:'Fraunces', serif; font-size:24px; letter-spacing:0.02em; font-weight:600; }
  .logo span{ color:var(--gold-bright); }
  nav ul{ display:flex; gap:36px; list-style:none; }
  nav ul li a{
    font-size:13px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--bone-dim); transition:color .2s;
    position:relative; padding-bottom:4px;
  }
  nav ul li a:hover, nav ul li a:focus-visible{ color:var(--bone); }
  nav ul li a::after{
    content:''; position:absolute; left:0; bottom:0; height:1px; width:0;
    background:var(--pink-bright); transition:width .25s;
  }
  nav ul li a:hover::after{ width:100%; }
  .nav-right{ display:flex; align-items:center; gap:22px; }
  .icon-btn{ position:relative; padding:6px; color:var(--bone); }
  .icon-btn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--gold-bright); outline-offset:2px;
  }
  .cart-count{
    position:absolute; top:-4px; right:-4px;
    background:var(--gold-bright); color:var(--ink);
    font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:500;
    width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .mobile-toggle{ display:none; }
  @media(max-width:800px){
    nav ul{ display:none; }
    .mobile-toggle{ display:block; }
  }

  .hero{
    display:grid; grid-template-columns:1.1fr 0.9fr; align-items:center;
    gap:40px; padding:90px 0 70px;
    min-height:78vh;
  }
  @media(max-width:900px){ .hero{ grid-template-columns:1fr; padding:50px 0 40px; } }
  .hero h1{
    font-size:clamp(40px, 6vw, 76px);
    line-height:0.98; font-weight:450; letter-spacing:-0.01em;
    margin:18px 0 26px;
  }
  .hero h1 em{ font-style:italic; color:var(--gold-bright); font-weight:450; }
  .hero p{ color:var(--bone-dim); font-size:16px; line-height:1.6; max-width:420px; margin-bottom:34px; }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:15px 30px; font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    border:1px solid var(--bone); transition:all .25s;
  }
  .btn-primary{ background:var(--bone); color:var(--ink); }
  .btn-primary:hover{ background:var(--pink-bright); border-color:var(--pink-bright); color:var(--ink); }
  .btn-ghost{ background:transparent; color:var(--bone); border-color:var(--line-strong); }
  .btn-ghost:hover{ border-color:var(--bone); }
  .btn-full{ width:100%; justify-content:center; }
  .btn[disabled]{ opacity:0.35; cursor:not-allowed; }
